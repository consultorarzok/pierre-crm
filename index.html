<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#662486">
<title>Pierre CRM</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/resumen" aria-label="Pierre Centro Profesional"><img src="assets/logo-horizontal-blanco.png" alt="Pierre Centro Profesional"></a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="side-foot">
      <button class="chip-op" id="opBtn" type="button" title="Quién está operando el CRM"></button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema claro/oscuro"></button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="menu-op" id="opBtnM" type="button"></button>
      <div class="top-title"><h1 id="pageTitle">Resumen</h1><p id="pageSub"></p></div>
      <div class="top-right">
        <span class="live" id="live" title="Los datos se actualizan solos cada minuto"><i></i><span id="liveTxt">En vivo</span></span>
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="Actualizar ahora">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn only-m" id="themeBtnM" type="button" aria-label="Cambiar tema"></button>
      </div>
    </header>
    <div class="gold-line" aria-hidden="true"></div>
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detalle del contacto"></aside>

<div class="op-pop" id="opPop" role="group" aria-label="Tu nombre" hidden>
  <form id="opForm">
    <label for="opInput"><b>¿Quién está atendiendo?</b><span>Tu nombre queda en cada contacto que marques, para que el equipo sepa quién lo tomó.</span></label>
    <input id="opInput" type="text" maxlength="40" placeholder="Ej: Facu, Romina" autocomplete="given-name" required>
    <div class="pop-actions"><button type="button" class="btn ghost sm" id="opCancel">Ahora no</button><button class="btn primary sm" type="submit">Guardar nombre</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
